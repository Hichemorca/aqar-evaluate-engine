[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["axios"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Add this to ensure data files are included
[[redirects]]
  from = "/data/*"
  to = "/data/:splat"
  status = 200