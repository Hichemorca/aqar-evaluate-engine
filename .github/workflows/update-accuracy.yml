name: Update Accuracy Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Node dependencies
        run: npm install axios
        
      - name: Install Python dependencies
        run: pip install xgboost pandas numpy scikit-learn
        
      - name: Layer 1 — Fetch consultancy reports
        run: node scripts/fetch-consultancy.js
        
      - name: Layer 2 — Fetch developer projects
        run: node scripts/fetch-developers.js
        
      - name: Layer 3 — Fetch government data
        run: node scripts/fetch-government.js
        
      - name: Layer 4 — Fetch DLD real transactions
        run: node scripts/fetch-dld.js
        continue-on-error: true
        
      - name: Layer 5 — Fetch generated transactions
        run: node scripts/fetch-transactions.js
        
      - name: Layer 6 — Train ML model
        run: python scripts/train-model.py
        continue-on-error: true
        
      - name: Evaluate all properties
        run: node scripts/evaluate-and-save.js
        
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Auto-update all data layers + ML training [skip ci]"
            git push origin main
          fi