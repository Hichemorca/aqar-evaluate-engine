name: Update Accuracy Data

on:
  schedule:
    - cron: '0 6 * * *'  # يومياً الساعة 6 صباحاً UTC
  workflow_dispatch:      # تشغيل يدوي

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install axios
        
      - name: Fetch transactions
        run: node scripts/fetch-transactions.js
        
      - name: Evaluate properties
        run: node scripts/evaluate-and-save.js
        
      - name: Commit and push if changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AQAR Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Auto-update accuracy data" && git push)