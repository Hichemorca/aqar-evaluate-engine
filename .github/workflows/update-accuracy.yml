name: Update Accuracy Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install axios
        
      - name: Fetch transactions
        run: node scripts/fetch-transactions.js
        
      - name: Evaluate properties
        run: node scripts/evaluate-and-save.js
        
      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || (git commit -m "📊 Auto-update accuracy data [skip ci]" && git push)