name: Update Accuracy Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accuracy-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          
      - name: Install Node dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
        
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-accuracy.txt
        
      - name: Layer 1 — Fetch consultancy reports
        run: node scripts/fetch-consultancy.js
        
      - name: Layer 2 — Fetch developer projects
        run: node scripts/fetch-developers.js
        
      - name: Layer 3 — Fetch government data
        run: node scripts/fetch-government.js
        
      - name: Layer 4 — Fetch DLD real transactions
        run: node scripts/fetch-dld.js
        
      - name: Validate verified DLD data
        run: node scripts/validate-dld-data.js
        
      - name: Optional Layer 5 — Fetch OSM GIS Data
        run: timeout --signal=TERM --kill-after=20s 5m node scripts/fetch-osm.js
        continue-on-error: true
        
      - name: Optional — Enrich eligible DLD records with current GIS cache
        run: rm -f data/dld-transactions-enriched.json && node scripts/enrich-with-coordinates.js
        continue-on-error: true

      - name: Layer 6 — Market Intelligence Analysis (required)
        run: node scripts/market-intelligence.js
        
      - name: Layer 7 — Load active calibration (required)
        run: node scripts/fetch-calibration-config.js

      - name: Layer 8 — Evaluate all properties (required)
        run: node scripts/evaluate-and-save.js

      - name: Generate Accuracy diagnostics
        run: node scripts/generate-accuracy-diagnostics.js

      - name: Generate lightweight client summaries
        run: node scripts/generate-client-summaries.js

      - name: Validate official artifacts and provenance
        run: node scripts/validate-official-artifacts.js

      - name: Optional Layer 9 — Train ML model
        run: python scripts/train-model.py
        continue-on-error: true
        
      - name: Final integrity gate before commit
        run: |
          node scripts/validate-official-artifacts.js
          git diff --name-only -- data/ models/ | sed '/^$/d' | sort

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add data/ models/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Auto-update all data layers + OSM GIS + Market Intelligence + ML [skip ci]"
            git push origin main
          fi