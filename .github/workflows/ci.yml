name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile smoke tests
        run: npm run mobile-smoke

      - name: Run public pages smoke tests
        run: npm run public-pages-smoke

      - name: Validate inline JavaScript syntax
        run: npm run validate-inline-js

      - name: Run test suite
        run: npm test

      - name: Validate summaries are current
        run: node scripts/generate-client-summaries.js --check

      - name: Validate JavaScript syntax
        run: |
          node --check netlify/functions/calibration-config.js
          node --check netlify/functions/dld-lookup.js
          node --check netlify/functions/scrape.js
          node --check netlify/functions/scrape-sold.js
          node --check netlify/functions/valuation-observation.js
          node --check shared/export.js
          node --check shared/market-intelligence.js
          node --check shared/accuracy-dashboard.js
          node --check shared/calibration.js
          node --check shared/index-accuracy-meta.js
          node --check shared/index-market-context.js
          node --check shared/index-district-context.js
          node --check shared/index-gis-helpers.js
          node --check shared/index-primary-interactions.js
          node --check scripts/evaluate-and-save.js
          node --check scripts/generate-client-summaries.js

      - name: Validate patch formatting
        run: git diff --check
