<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIAYAAR Data Export</title>
  <link rel="icon" href="/assets/branding/favicon.png" type="image/png" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #060d1a; color: #e8edf5; padding: 40px; text-align: center; }
    .btn { display: inline-block; padding: 14px 28px; margin: 10px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; transition: all 0.2s; }
    .btn-csv { background: #00b86e; color: #000; }
    .btn-json { background: #3c8cdc; color: #fff; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .stats { margin: 20px 0; font-size: 14px; color: #8a9ab0; }
    .stats .accuracy-value { color: #00b86e; }
    .admin-link { color: #d4920e; font-size: 12px; font-weight: 700; margin-right: 16px; }
    .dashboard-link { color: #8a9ab0; font-size: 12px; }
  </style>
  <link rel="stylesheet" href="/shared/miayaar-brand.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
  <a class="miayaar-brand-lockup" href="/" aria-label="MIAYAAR Valuation Intelligence Engine"><img class="miayaar-logo-horizontal" src="/assets/branding/miayaar-horizontal-dark.png" alt="MIAYAAR &mdash; Valuation Intelligence Engine" /></a>
  <h1 class="miayaar-page-title">Data Export</h1>
  <div class="stats" id="stats" aria-live="polite">Loading...</div>
  <button class="btn btn-csv" id="exportCsvButton">Download CSV (Excel)</button>
  <button class="btn btn-json" id="exportJsonButton">Download JSON</button>
  <br><br>
  <a href="/admin-calibration" class="admin-link">Admin Login</a>
  <a href="/accuracy-dashboard" class="dashboard-link">Back to Dashboard</a>

  <script src="/shared/export.js"></script>
  </main>
</body>
</html>
