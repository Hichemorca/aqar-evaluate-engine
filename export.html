<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MIAYAAR Data Export</title>
  <link rel="icon" href="/assets/branding/favicon.png" type="image/png" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #060d1a; color: #e8edf5; padding: 40px; text-align: center; }
    .btn { display: inline-block; padding: 14px 28px; margin: 10px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; transition: all 0.2s; }
    .btn-csv { background: #00b86e; color: #000; }
    .btn-json { background: #3c8cdc; color: #fff; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .stats { margin: 20px 0; font-size: 14px; color: #8a9ab0; }
    .admin-link { color: #d4920e; font-size: 12px; font-weight: 700; margin-right: 16px; }
  </style>
  <link rel="stylesheet" href="/shared/miayaar-brand.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
  <a class="miayaar-brand-lockup" href="/" aria-label="MIAYAAR Valuation Intelligence Engine"><img class="miayaar-logo-horizontal" src="/assets/branding/miayaar-horizontal-dark.png" alt="MIAYAAR &mdash; Valuation Intelligence Engine" /></a>
  <h1 class="miayaar-page-title">Data Export</h1>
  <div class="stats" id="stats" aria-live="polite">Loading...</div>
  <button class="btn btn-csv" onclick="exportCSV()">Download CSV (Excel)</button>
  <button class="btn btn-json" onclick="exportJSON()">Download JSON</button>
  <br><br>
  <a href="/admin-calibration" class="admin-link">Admin Login</a>
  <a href="/accuracy-dashboard" style="color:#8a9ab0;font-size:12px">Back to Dashboard</a>

  <script>
    let data = null;

    async function loadData() {
      try {
        const res = await fetch('/data/accuracy-data.json');
        data = await res.json();
        document.getElementById('stats').innerHTML = `
          &bull; ${data.metrics.totalRecords} transactions loaded |
          MIAYAAR accuracy: <b style="color:#00b86e">${data.metrics.avgAccuracy}%</b> |
          Deviation: &plusmn;${data.metrics.avgDeviation}%
        `;
      } catch(e) {
        document.getElementById('stats').textContent = 'Data not available';
      }
    }

    function csvCell(value) {
      const text = String(value ?? '');
      const safeText = typeof value === 'string' && /^[=+\-@]/.test(text) ? `'${text}` : text;
      return `"${safeText.replace(/"/g, '""')}"`;
    }

    function exportCSV() {
      if (!data || !data.records) return alert('No data');
      const headers = ['Ref', 'Type', 'District', 'Area (sqm)', 'Actual Price (AED)', 'MIAYAAR Valuation (AED)', 'MIAYAAR vs Actual (%)', 'Date'];
      const rows = data.records.map(r => [
        r.propertyRef, r.propertyType, r.district, r.area, r.actualSalePrice,
        r.aqarValuation, r.aqarVsActual, r.saleDate
      ].map(csvCell).join(','));
      downloadFile([headers.map(csvCell).join(','), ...rows].join('\n') + '\n', 'miayaar-accuracy-data.csv', 'text/csv;charset=utf-8');
    }

    function exportJSON() {
      if (!data) return alert('No data');
      downloadFile(JSON.stringify(data, null, 2), 'miayaar-accuracy-data.json', 'application/json');
    }

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type });
      const a = document.createElement('a');
      const objectUrl = URL.createObjectURL(blob);
      a.href = objectUrl;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(objectUrl), 0);
    }

    loadData();
  </script>
  </main>
</body>
</html>
